name: Community pack submission
description: Submit a pack or ask for help preparing a pull request.
title: "Pack submission: "
body:
  - type: input
    id: name
    attributes:
      label: Pack type, name and version
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source, licence and exported pack
      description: Link the source and attach your .pfeplugin file. Include artwork licensing.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: PaintFE build and testing
      description: For effects, describe defaults, selection, alpha, Cancel and Undo. For themes or icons, describe Preview, Keep, Restore, restart and removal. Include expected results.
    validations:
      required: true
