name: Publish plugins
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New catalogue release tag, for example v0.1.0'
        required: true
permissions:
  contents: write
  pages: write
concurrency:
  group: plugin-catalogue
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/catalogue.py validate
      - run: python -m unittest discover -s tests -v
      - name: Package, sign and publish approved plugins
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/publish.py --tag "$RELEASE_TAG"
